# Builds llama-server and llama-cli with CUDA for several GPU architectures.
# Run it by hand: Actions tab > "Build CUDA multi-arch" > Run workflow.
# Modelled on llama.cpp's own release workflow (ubuntu-cuda job).

name: Build CUDA multi-arch

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA image tag, used as nvidia/cuda:<tag>-devel-ubuntu24.04"
        default: "13.4.1"
        type: string
      cuda_archs:
        description: "CUDA architectures, semicolon separated (T4=75, A100=80, L4=89, G4=120a)"
        default: "75-real;80-real;89-real;120a-real"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:${{ inputs.cuda_version }}-devel-ubuntu24.04
    timeout-minutes: 340
    defaults:
      run:
        shell: bash

    steps:
      # The container has no git. Install it before checkout so a real repo is created.
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Clone
        uses: actions/checkout@v6

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends build-essential cmake ninja-build libssl-dev

      - name: Configure
        env:
          CUDA_ARCHS: ${{ inputs.cuda_archs }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_NCCL=OFF \
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 \
            -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCHS"

      - name: Build
        run: cmake --build build --config Release --target llama-server llama-cli

      # No GPU on this runner, so we inspect the files instead of running them.
      - name: Show what was built
        run: |
          ls -lh build/bin
          echo "--- GPU architectures inside libggml-cuda.so ---"
          cuobjdump --list-elf build/bin/libggml-cuda.so | grep -o 'sm_[0-9a-z]*' | sort -u || true
          echo "--- llama-server dynamic section ---"
          readelf -d build/bin/llama-server | grep -E 'NEEDED|RUNPATH|RPATH' || true

      - name: Pack binaries and CUDA runtime
        env:
          CUDA_VERSION: ${{ inputs.cuda_version }}
        run: |
          mkdir -p out cudart
          cp LICENSE build/bin/ || true
          tar czf "out/llama-bin-cuda${CUDA_VERSION}.tar.gz" -C build bin
          major="${CUDA_VERSION%%.*}"
          # cp -L turns the symlinks into plain files
          cp -L "/usr/local/cuda/lib64/libcudart.so.${major}" cudart/
          cp -L "/usr/local/cuda/lib64/libcublas.so.${major}" cudart/
          cp -L "/usr/local/cuda/lib64/libcublasLt.so.${major}" cudart/
          tar czf "out/cudart-cuda${CUDA_VERSION}.tar.gz" -C cudart .
          ls -lh out

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: llama-bin-cuda${{ inputs.cuda_version }}
          path: out/llama-bin-cuda*.tar.gz
          retention-days: 14

      - name: Upload CUDA runtime libraries
        uses: actions/upload-artifact@v7
        with:
          name: cudart-cuda${{ inputs.cuda_version }}
          path: out/cudart-cuda*.tar.gz
          retention-days: 14
